<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1C23"/>
      <stop offset="100%" stop-color="#0E0F12"/>
    </linearGradient>
    <linearGradient id="pcbGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F232B"/>
      <stop offset="100%" stop-color="#14161C"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="chipGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3139"/>
      <stop offset="100%" stop-color="#181A1F"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#D94814"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#FF6B35" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Base Icon Canvas Rounded Rect -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bgGrad)" stroke="#2B2F38" stroke-width="4" filter="url(#dropGlow)"/>

  <!-- PCB Traces / Circuit Art in Background -->
  <g stroke="#262A34" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M96 160 L140 160 L180 200 L180 280"/>
    <path d="M416 160 L372 160 L332 200 L332 280"/>
    <path d="M120 400 L160 360 L200 360"/>
    <path d="M392 400 L352 360 L312 360"/>
    <circle cx="180" cy="280" r="4" fill="#363C4A"/>
    <circle cx="332" cy="280" r="4" fill="#363C4A"/>
  </g>

  <!-- NVMe M.2 Card Body -->
  <rect x="136" y="80" width="240" height="352" rx="18" fill="url(#pcbGrad)" stroke="#333844" stroke-width="3"/>

  <!-- Mounting Screw Notch at Bottom -->
  <path d="M236 432 A20 20 0 0 0 276 432 Z" fill="#0E0F12" stroke="#333844" stroke-width="3"/>

  <!-- Golden Contact Pins (M.2 Key) at Top -->
  <g fill="url(#goldGrad)">
    <!-- Pin row left -->
    <rect x="156" y="82" width="10" height="24" rx="2"/>
    <rect x="172" y="82" width="10" height="24" rx="2"/>
    <rect x="188" y="82" width="10" height="24" rx="2"/>
    <rect x="204" y="82" width="10" height="24" rx="2"/>
    <rect x="220" y="82" width="10" height="24" rx="2"/>
    <!-- M-Key notch gap: x=234 to x=262 -->
    <!-- Pin row right -->
    <rect x="266" y="82" width="10" height="24" rx="2"/>
    <rect x="282" y="82" width="10" height="24" rx="2"/>
    <rect x="298" y="82" width="10" height="24" rx="2"/>
    <rect x="314" y="82" width="10" height="24" rx="2"/>
    <rect x="330" y="82" width="10" height="24" rx="2"/>
    <rect x="346" y="82" width="10" height="24" rx="2"/>
  </g>

  <!-- Controller Chip -->
  <rect x="186" y="136" width="140" height="100" rx="10" fill="url(#chipGrad)" stroke="#424755" stroke-width="2"/>
  <!-- Controller Silver Marking -->
  <rect x="198" y="148" width="116" height="4" rx="2" fill="#4B5263"/>
  <rect x="198" y="158" width="60" height="3" rx="1.5" fill="#3B414F"/>
  <text x="256" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#8C93A4" text-anchor="middle" letter-spacing="2">NVMe CONTROLLER</text>

  <!-- NAND Flash Packages -->
  <rect x="166" y="256" width="80" height="110" rx="6" fill="#1C1E24" stroke="#2F333D" stroke-width="2"/>
  <rect x="266" y="256" width="80" height="110" rx="6" fill="#1C1E24" stroke="#2F333D" stroke-width="2"/>
  <text x="206" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#5A6172" text-anchor="middle">NAND 01</text>
  <text x="306" y="315" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="600" fill="#5A6172" text-anchor="middle">NAND 02</text>

  <!-- Sentinel Shield & Heartbeat Pulse Overlay -->
  <g transform="translate(256, 310)">
    <!-- Outer Glow Shield -->
    <circle cx="0" cy="0" r="62" fill="#14161C" stroke="url(#accentGrad)" stroke-width="5" filter="url(#dropGlow)"/>
    <circle cx="0" cy="0" r="50" fill="#181B22" stroke="#2C303B" stroke-width="2"/>

    <!-- Pulse ECG Line (Sentinel Telemetry / Health Indicator) -->
    <path d="M-36 0 L-20 0 L-12 -18 L-2 22 L8 -12 L16 8 L22 0 L36 0" 
          fill="none" 
          stroke="url(#pulseGrad)" 
          stroke-width="4.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
    
    <!-- Status Indicator Beacon -->
    <circle cx="0" cy="-30" r="4" fill="#FF6B35"/>
  </g>

</svg>
